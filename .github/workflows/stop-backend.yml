name: Stop Backend

on:
  workflow_dispatch:
    inputs:
      stop_rds:
        description: "RDS도 중지할지 여부 (false면 RDS 유지)"
        type: boolean
        default: true

# start/stop 이 겹치면 state 락 충돌과 NAT/RDS 상태 꼬임이 생기므로 하나씩만 실행한다.
concurrency:
  group: backend-toggle
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-2
      # destroy 에도 필수 변수 값이 필요하다.
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_certificate_arn: ${{ secrets.CERT_ARN }}
      TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---- Terraform: compute 삭제 (base 는 건드리지 않는다) ----
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      # NAT/RDS 식별자는 base 스택 출력에서 가져온다.
      - name: base 스택 출력 조회 (NAT, RDS 식별자)
        working-directory: terraform/base
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          echo "NAT_ID=$(terraform output -raw nat_instance_id)" >> $GITHUB_ENV
          echo "RDS_ID=$(terraform output -raw rds_identifier)" >> $GITHUB_ENV

      - name: Terraform init
        working-directory: terraform/compute
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform destroy (compute)
        working-directory: terraform/compute
        run: terraform destroy -input=false -auto-approve

      # ---- Terraform이 다루지 못하는 부분: RDS 중지, NAT 인스턴스 중지 + EIP 반납 ----
      - name: RDS 중지
        if: ${{ inputs.stop_rds }}
        run: |
          RDS_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_ID" \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text)

          if [ "$RDS_STATUS" = "available" ]; then
            aws rds stop-db-instance --db-instance-identifier "$RDS_ID" > /dev/null
            echo "RDS 중지 완료"
          else
            echo "RDS 이미 중지 중, 건너뜀"
          fi

      - name: NAT Instance 중지
        run: |
          NAT_STATUS=$(aws ec2 describe-instances \
            --instance-ids "$NAT_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          if [ "$NAT_STATUS" = "running" ]; then
            aws ec2 stop-instances --instance-ids "$NAT_ID" > /dev/null
            echo "NAT Instance 중지 완료"

            NAT_EIP_ALLOC=$(aws ec2 describe-addresses \
              --filters "Name=instance-id,Values=$NAT_ID" \
              --query "Addresses[0].AllocationId" \
              --output text)

            if [ -n "$NAT_EIP_ALLOC" ] && [ "$NAT_EIP_ALLOC" != "None" ]; then
              NAT_EIP_ASSOC=$(aws ec2 describe-addresses \
                --filters "Name=instance-id,Values=$NAT_ID" \
                --query "Addresses[0].AssociationId" \
                --output text)
              aws ec2 disassociate-address --association-id "$NAT_EIP_ASSOC" > /dev/null
              aws ec2 release-address --allocation-id "$NAT_EIP_ALLOC" > /dev/null
              echo "NAT Instance Elastic IP 반납 완료"
            else
              echo "NAT Instance에 연결된 Elastic IP 없음, 건너뜀"
            fi
          else
            echo "NAT Instance 이미 중지 중, 건너뜀"
          fi

  notify:
    needs: stop
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord 알림
        run: |
          TIME=$(TZ="Asia/Seoul" date +"%Y-%m-%d %H:%M:%S KST")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BOT_NAME="${{ vars.DISCORD_BOT_NAME }}"
          BOT_NAME="${BOT_NAME:-Pangyeori Infra Bot}"
          AVATAR_URL="${{ vars.DISCORD_BOT_AVATAR_URL }}"
          AVATAR_FIELD=""
          if [ -n "$AVATAR_URL" ]; then
            AVATAR_FIELD="\"avatar_url\": \"$AVATAR_URL\","
          fi

          if [ "${{ needs.stop.result }}" = "success" ]; then
            COLOR=3066993
            STATUS="✅ 성공"
            DESC="백엔드 서버가 정상적으로 중지됐습니다. (Terraform)"
          else
            COLOR=15158332
            STATUS="❌ 실패"
            DESC="백엔드 서버 중지에 실패했습니다. (Terraform)"
          fi

          curl -s -H "Content-Type: application/json" \
            -d "{
              \"username\": \"$BOT_NAME\",
              $AVATAR_FIELD
              \"embeds\": [{
                \"title\": \"$STATUS | Backend Down (Terraform)\",
                \"description\": \"$DESC\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"실행자\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                  {\"name\": \"시간\", \"value\": \"$TIME\", \"inline\": true},
                  {\"name\": \"로그\", \"value\": \"[Actions 실행 보기]($RUN_URL)\", \"inline\": false}
                ]
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
